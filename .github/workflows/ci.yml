name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Module files are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify

      - name: Install pinned tools
        run: make tools

      - name: Generated code is up to date
        run: make proto-check

      - name: make check
        run: make check

  crash:
    # Phase 2 gate: real SIGKILL cycles against a writer process. Simulated
    # power loss and crash-at-every-step already run inside make check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: kill -9 cycles
        run: make crash

  storage-gate:
    # Phase 3 gate at full size: a million-operation model test and a crash
    # at every step of flush and compaction, without the race detector.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: storage gate
        run: make storage-gate

  sim:
    # Phase 6 gate: 10,000 seeded Raft schedules with invariant and liveness
    # checks, without the race detector.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: simulation
        run: make sim SEEDS=10000

  fuzz:
    # Every fuzz target for 10 seconds (docs/PLAN.md, "Test layers": short
    # fuzzing on every commit); the nightly workflow fuzzes 5 minutes each.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: fuzz targets
        run: make fuzz FUZZTIME=10s

  web:
    # The dashboard: typecheck, unit tests on fixtures captured from a real
    # console, production build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: cd web && npm ci --no-audit --no-fund

      - name: typecheck and test
        run: make web-test

      - name: build
        run: cd web && npm run build

  console-postgres:
    # dkv-console's history store against a real PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: dkv
          POSTGRES_PASSWORD: dkv-ci
          POSTGRES_DB: dkv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dkv"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: store tests
        env:
          DKV_TEST_POSTGRES_DSN: postgres://dkv:dkv-ci@localhost:5432/dkv_test?sslmode=disable
        run: go test -race -count=1 -v ./cmd/dkv-console

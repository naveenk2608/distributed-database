name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Module files are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify

      - name: Install pinned tools
        run: make tools

      - name: Generated code is up to date
        run: make proto-check

      - name: make check
        run: make check

  crash:
    # Phase 2 gate: real SIGKILL cycles against a writer process. Simulated
    # power loss and crash-at-every-step already run inside make check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: kill -9 cycles
        run: make crash

name: Docker gates

# The phase gates that need Docker Compose: Phase 4 (cluster formation and
# failure detection), Phase 9 (the dashboard, in Chromium) and the Phase 10
# five-node profile. The nightly
# workflow calls this one; it can also be dispatched on its own.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compose:
    # Phase 4 gate in Docker Compose: three nodes form a cluster from
    # configuration and report a SIGKILLed one down within the window.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: compose gate
        run: make compose-gate

  five:
    # Phase 10: the five-node Compose profile. n4 and n5 join the cluster
    # the first three formed, are given replicas, and serve.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: five nodes
        run: make compose-five

  dashboard:
    # Phase 9 gate in Docker Compose with Chromium: a killed node on the
    # dashboard within one poll interval, events in order, writes with the
    # console stopped, history reloaded from PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: dashboard dependencies and Chromium
        run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: dashboard gate
        run: make dashboard-gate

      - name: keep the container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-gate
          path: |
            dashboard-gate.log
            web/test-results/
          if-no-files-found: ignore

syntax = "proto3";

package dkv.v1;

option go_package = "github.com/naveenk2608/distributed-database/gen/dkv/v1";

// Internal Raft messages between replicas
service Raft {
  // Send a batch of Raft messages
  rpc Send(RaftMessageBatch) returns (google.protobuf.Empty);
  // Stream snapshots for InstallSnapshot
  rpc SnapshotStream(stream SnapshotChunk) returns (SnapshotResponse);
}

message RaftMessageBatch {
  string from_node_id = 1;
  repeated RaftMessage messages = 2;
}

message RaftMessage {
  uint64 to_shard = 1;
  uint64 to_replica_id = 2;
  MessageType type = 3;
  uint64 term = 4;
  uint64 index = 5;
  uint64 commit_index = 6;
  bytes entries = 7;  // Serialized Raft entries
  bytes snapshot = 8; // Serialized snapshot metadata
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_REQUEST_VOTE = 1;
  MESSAGE_TYPE_REQUEST_VOTE_RESPONSE = 2;
  MESSAGE_TYPE_APPEND_ENTRIES = 3;
  MESSAGE_TYPE_APPEND_ENTRIES_RESPONSE = 4;
  MESSAGE_TYPE_INSTALL_SNAPSHOT = 5;
  MESSAGE_TYPE_INSTALL_SNAPSHOT_RESPONSE = 6;
  MESSAGE_TYPE_TIMEOUT_NOW = 7; // For leader transfer
}

message SnapshotChunk {
  uint64 shard_id = 1;
  uint64 replica_id = 2;
  bytes data = 3;
  bool last = 4;
}

message SnapshotResponse {
  bool success = 1;
  string error = 2;
}
syntax = "proto3";

package dkv.v1;

option go_package = "github.com/naveenk2608/distributed-database/gen/dkv/v1";

import "google/protobuf/empty.proto";
import "kv.proto";

// Admin service for operator tooling and dashboard
service Admin {
  // Get node status
  rpc Status(google.protobuf.Empty) returns (NodeStatus);
  // Get metrics in Prometheus format
  rpc Metrics(google.protobuf.Empty) returns (MetricsResponse);
  // Get cluster events
  rpc Events(EventsRequest) returns (stream Event);
  // Drain a node (stop accepting new requests, finish in-flight)
  rpc Drain(DrainRequest) returns (DrainResponse);
  // Decommission a node (move replicas elsewhere)
  rpc Decommission(DecommissionRequest) returns (DecommissionResponse);
  // Transfer leadership of a shard
  rpc TransferLeader(TransferLeaderRequest) returns (TransferLeaderResponse);
  // Get shard map
  rpc ShardMap(google.protobuf.Empty) returns (ShardMapResponse);
}

message NodeStatus {
  string node_id = 1;
  string address = 2;
  uint64 uptime_seconds = 3;
  repeated ShardStatus shards = 4;
  StorageStats storage = 5;
}

message ShardStatus {
  uint64 shard_id = 1;
  ReplicaRole role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 applied_index = 5;
  string leader_id = 6;
  uint64 replication_lag = 7;  // commit - applied
}

message StorageStats {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 memtable_bytes = 3;
  uint64 sstable_count = 4;
  uint64 wal_segments = 5;
  CompactionStats compaction = 6;
}

message CompactionStats {
  uint64 bytes_read = 1;
  uint64 bytes_written = 2;
  uint64 files_compacted = 3;
  uint64 duration_ms = 4;
}

message MetricsResponse {
  string prometheus_text = 1;
}

message EventsRequest {
  uint64 since_sequence = 1;
  uint32 limit = 2;
}

message Event {
  uint64 sequence = 1;
  int64 timestamp = 2;  // Unix nanoseconds
  EventType type = 3;
  string node_id = 4;
  uint64 shard_id = 5;
  string message = 6;
  map<string, string> fields = 7;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_ELECTION = 1;
  EVENT_TYPE_LEADER_CHANGE = 2;
  EVENT_TYPE_NODE_JOIN = 3;
  EVENT_TYPE_NODE_LEAVE = 4;
  EVENT_TYPE_NODE_DEAD = 5;
  EVENT_TYPE_REBALANCE_START = 6;
  EVENT_TYPE_REBALANCE_COMPLETE = 7;
  EVENT_TYPE_SNAPSHOT_START = 8;
  EVENT_TYPE_SNAPSHOT_COMPLETE = 9;
  EVENT_TYPE_COMPACTION_START = 10;
  EVENT_TYPE_COMPACTION_COMPLETE = 11;
  EVENT_TYPE_ERROR = 12;
}

message DrainRequest {
  bool wait = 1;
  int64 timeout_seconds = 2;
}

message DrainResponse {
  bool success = 1;
  string error = 2;
}

message DecommissionRequest {
  string node_id = 1;
}

message DecommissionResponse {
  bool success = 1;
  string error = 2;
}

message TransferLeaderRequest {
  uint64 shard_id = 1;
  string target_node_id = 2;
}

message TransferLeaderResponse {
  bool success = 1;
  string error = 2;
}

message ShardMapResponse {
  uint64 epoch = 1;
  repeated ShardDescriptor shards = 2;
}
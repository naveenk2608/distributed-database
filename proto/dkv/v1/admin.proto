syntax = "proto3";

package dkv.v1;

import "dkv/v1/cluster.proto";
import "dkv/v1/meta.proto";

option go_package = "github.com/naveenk2608/distributed-database/gen/dkv/v1;dkvv1";

// AdminService is the operator API, served on every node's public address
// next to KVService.
service AdminService {
  // ClusterStatus returns this node's view of the cluster: every peer in its
  // bootstrap list, including itself, and whether it is reachable.
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);

  // ShardMap returns where every shard is placed, and for the shards the
  // answering node holds, the state of its local copy.
  rpc ShardMap(ShardMapRequest) returns (ShardMapResponse);

  // Decommission asks the cluster to move every replica off a node; the
  // node is then marked decommissioned and can be shut down.
  rpc Decommission(DecommissionRequest) returns (DecommissionResponse);

  // Drain asks the cluster to move every leadership off a node and give it
  // none until it is undrained (drain = false). Its replicas stay.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // TransferLeader asks a shard's leader to hand leadership to one of the
  // shard's voters. The rebalancer may later move it again to keep
  // leadership balanced; Drain is the lasting way to keep a node from
  // leading.
  rpc TransferLeader(AdminServiceTransferLeaderRequest) returns (AdminServiceTransferLeaderResponse);

  // Stats returns the answering node's request counters and latency
  // histograms, and the Raft and storage state of each of its replicas.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Events returns the answering node's recent events (elections, failure
  // detection, membership changes), oldest first.
  rpc Events(EventsRequest) returns (EventsResponse);
}

message DrainRequest {
  string node_id = 1;
  // drain = false undrains the node.
  bool drain = 2;
}

message DrainResponse {}

message AdminServiceTransferLeaderRequest {
  int32 shard = 1;
  // node_id is the voter to hand leadership to.
  string node_id = 2;
}

message AdminServiceTransferLeaderResponse {}

message StatsRequest {}

message StatsResponse {
  string node_id = 1;
  // When the node collected these numbers, and when it started.
  int64 unix_nano = 2;
  int64 started_unix_nano = 3;
  // Upper bounds of the latency histogram buckets, in seconds, shared by
  // every operation.
  repeated double latency_bounds_seconds = 4;
  repeated OpStats ops = 5;
  repeated ReplicaStats replicas = 6;
  // The block cache every engine on the node shares.
  CacheStats block_cache = 7;
}

// OpStats counts one public API operation since the node started.
message OpStats {
  // op is put, get, delete or cas.
  string op = 1;
  uint64 ok = 2;
  uint64 errors = 3;
  double latency_sum_seconds = 4;
  // latency_cumulative[i] counts requests that took at most
  // latency_bounds_seconds[i].
  repeated uint64 latency_cumulative = 5;
}

// ReplicaStats is one local replica: its Raft state and its engine.
message ReplicaStats {
  ReplicaStatus raft = 1;
  EngineStats engine = 2;
}

message EngineStats {
  uint64 last_seq = 1;
  int32 memtables = 2;
  int64 memtable_bytes = 3;
  int32 tables = 4;
  uint64 table_bytes = 5;
  uint64 table_entries = 6;
  int64 flushes = 7;
  int64 flush_bytes = 8;
  int64 compactions = 9;
  int64 compaction_bytes_read = 10;
  int64 compaction_bytes_written = 11;
  int64 write_stalls = 12;
  int64 write_slowdowns = 13;
}

message CacheStats {
  int64 capacity_bytes = 1;
  int64 used_bytes = 2;
  int64 hits = 3;
  int64 misses = 4;
}

message EventsRequest {
  // after: return events with a higher sequence number.
  uint64 after = 1;
  // limit: at most this many; 0 means 1,000.
  uint32 limit = 2;
}

message EventsResponse {
  string node_id = 1;
  repeated Event events = 2;
  // oldest is the sequence number of the oldest event the node still
  // keeps; a reader that saw up to n and gets oldest > n+1 missed events.
  uint64 oldest = 3;
}

message Event {
  uint64 seq = 1;
  int64 unix_nano = 2;
  // kind: leader_elected, leader_stepped_down, peer_down, peer_up,
  // node_dead, node_alive, replica_added, replica_promoted,
  // replica_removed, snapshot_installed, leader_transfer.
  string kind = 3;
  // shard: the Raft group (-1 the meta group); has_shard is false for
  // events about no group.
  int32 shard = 4;
  bool has_shard = 5;
  // node: the member the event concerns (a node ID or peer address).
  string node = 6;
  uint64 term = 7;
  uint64 index = 8;
  string detail = 9;
}

message DecommissionRequest {
  string node_id = 1;
}

message DecommissionResponse {}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  NodeInfo self = 1;
  repeated MemberStatus members = 2;
}

enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  // Not reached yet since this node started.
  MEMBER_STATE_UNKNOWN = 1;
  // Answered a ping within the configured window (cluster.down_after).
  MEMBER_STATE_UP = 2;
  // No answer for longer than the window.
  MEMBER_STATE_DOWN = 3;
}

message MemberStatus {
  // addr is the peer's address as listed in the bootstrap peer list.
  string addr = 1;
  // node is the identity the peer reported in its last answer; empty if it
  // has never answered.
  NodeInfo node = 2;
  MemberState state = 3;
  // self is true for the node answering this request.
  bool self = 4;
  int64 last_seen_unix_nano = 5;
  int64 rtt_nanos = 6;
  uint32 consecutive_failures = 7;
  string last_error = 8;
  // node_state is the meta group's record of the node; suspect is set when
  // the meta leader has not heard its heartbeat for liveness.suspect_after.
  NodeState node_state = 9;
  bool suspect = 10;
  // drained: an operator drained the node (dkvctl drain); it leads no group.
  bool drained = 11;
}

message ShardMapRequest {}

message ShardMapResponse {
  uint32 shard_count = 1;
  uint32 replication_factor = 2;
  repeated ShardInfo shards = 3;
}

message ShardInfo {
  uint32 shard = 1;
  // replicas are internal addresses, in placement order.
  repeated string replicas = 2;
  // local is true if the answering node holds a replica of the shard.
  bool local = 3;
  // last_seq is the local replica's last applied sequence number (its
  // applied Raft index).
  uint64 last_seq = 4;
  // For a local replica: the leader it knows of, its term, its role and
  // its commit index.
  string leader = 5;
  uint64 term = 6;
  string role = 7;
  uint64 commit_index = 8;
  // voter_ids and learner_ids name the members by node ID; replicas lists
  // the voters' internal addresses.
  repeated string voter_ids = 9;
  repeated string learner_ids = 10;
}

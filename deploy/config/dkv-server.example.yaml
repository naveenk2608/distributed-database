# Example dkv-server configuration. Every key can also be set with a
# DKV_* environment variable or a flag; run `dkv-server -h` for the list.
# Priority: flags > environment > this file > built-in defaults.

server:
  # Required. Port 0 picks a free port; the bound address is logged.
  grpc_addr: "127.0.0.1:7070"
  shutdown_timeout: 10s
  # Admin HTTP API: status, shard map, statistics and events as JSON, and
  # Prometheus metrics at /metrics; dkv-console polls it. Empty disables it.
  admin_addr: "127.0.0.1:7200"

cluster:
  # Leave internal_addr and peers unset to run a single standalone node.
  name: dkv
  # internal_addr: "10.0.0.1:7100"     # node-to-node API
  # advertise_addr: "10.0.0.1:7100"    # needed if internal_addr is 0.0.0.0:PORT
  # Bootstrap peers: the nodes that create the cluster together (each lists
  # all of them, itself included). A node added later sets join instead.
  # peers: ["10.0.0.1:7100", "10.0.0.2:7100", "10.0.0.3:7100"]
  # join: ["10.0.0.1:7100", "10.0.0.2:7100"]
  ping_interval: 1s
  ping_timeout: 500ms
  down_after: 5s                       # silence before a peer is reported down
  # Fixed when the cluster is bootstrapped:
  shards: 64
  replication_factor: 3
  meta_replicas: 3                     # size of the meta group

transport:
  dial_timeout: 2s
  keepalive_time: 10s
  keepalive_timeout: 3s

# Raft settings for every shard replica on a cluster node. One ticker per
# node drives all replicas.
raft:
  tick_interval: 50ms
  election_ticks: 10                   # timeout drawn from [10, 20) ticks
  heartbeat_ticks: 2
  session_ttl: 1h                      # client deduplication window
  compact_entries: 10000               # raft log length that triggers compaction

# Failure detection: nodes heartbeat the meta group's leader, which declares
# a node dead after dead_after of silence and moves its replicas elsewhere.
liveness:
  heartbeat_interval: 1s
  suspect_after: 3s
  dead_after: 30s

# The rebalancer runs on the meta leader and moves one replica step per
# group per round.
rebalance:
  interval: 1s

storage:
  # Required. Data directory; created if missing. A cluster node keeps one
  # engine and one Raft log per shard replica under shards/NNNN/.
  dir: "/var/lib/dkv"
  # Sync policy. Standalone, for the engine's WAL: always fsyncs before
  # acknowledging (group commit shares one fsync between concurrent writes);
  # interval fsyncs every sync_interval, so a power loss can lose that
  # interval's acknowledged writes; never is for measuring fsync cost only.
  # In a cluster the Raft log is a replica's only log: always and interval
  # both fsync it before acknowledging a write, and the engine replays what
  # it had not flushed from it after a restart. never skips those fsyncs too,
  # so a power loss can lose acknowledged writes.
  sync: always
  # In a cluster, also keep each replica's engine log (two fsyncs per write),
  # to compare with the default single-log path (docs/adr/0010).
  engine_wal: false
  sync_interval: 10ms
  # Memtable size at which a new memtable and WAL segment start.
  memtable_bytes: 4194304

limits:
  max_key_bytes: 4096
  max_value_bytes: 1048576

log:
  level: info   # debug, info, warn, error
  format: json  # json or text
